name: Release Changelog

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: macos-15
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
        # Lokasi file configurasi
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
         
        # Branch target
          target-branch: ${{ github.ref_name }}
          
        # Token untuk membuat PR dan release
          token: ${{ secrets.GITHUB_TOKEN }}


        # Update Info.plist setelah release dibuat
      - name: Checkout code
        if: steps.release.outputs.release_created
        uses: actions/checkout@v4
        with:
          ref: main
          
      - name: Update Info.plist
        if: steps.release.outputs.release_created
        run: |
          VERSION="${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" LearnCHANGELOG/Info.plist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LearnCHANGELOG/Info.plist
          git commit -m "chore: update Info.plist to $VERSION [skip ci]"
          git push

      # Optional: Tampilkan output untuk debugging
      - name: Show Release Output
        if: steps.release.outputs.release_created
        run: |
            echo "Release created: ${{ steps.release.ouputs.release_created }}"
            echo "Tag name: ${{ steps.release.outputs.tag_name }}"
            echo "Version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"
            echo "Upload URL: ${{ steps.release.outputs.upload_url }}"
